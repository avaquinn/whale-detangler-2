name: Scan Dependencies

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  osv:
    name: OSV-Scanner
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0
    with:
      scan-args: |-
        --recursive
        ./
      fail-on-vuln: true
